<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PARADOX LAB</title><style> *{box-sizing:border-box}body{margin:0;background:#090b15;color:#e8e8ff;font:15px system-ui}header{padding:24px;border-bottom:1px solid #30304d;letter-spacing:3px}small{color:#9295b4}main{display:grid;grid-template-columns:260px 1fr 300px;gap:16px;padding:20px}section{background:#111425;border:1px solid #30304d;border-radius:12px;padding:18px}h2{font-size:16px;color:#b5a5ff}button,select{background:#252344;color:white;border:1px solid #6556a5;border-radius:7px;padding:10px;margin:4px;cursor:pointer}button:hover{background:#514386}svg{width:100%;height:420px;background:radial-gradient(#21203f,#0c0e1a);border-radius:12px}pre{white-space:pre-wrap;line-height:1.7}#history{max-height:310px;overflow:auto} .bad{color:#ff718f}.good{color:#76e8b1}label{display:block;margin:12px 0} @media(max-width:900px){main{grid-template-columns:1fr}svg{height:340px}}</style><header>◈ PARADOX LAB <small> / 悖论实验室 · V0.2</small></header><main><section><h2>01 / 逻辑培养舱</h2><label>节点数量 <select id="n"></select></label><button onclick="seed(true)">奇数否定环</button><button onclick="seed(false)">偶数否定环</button><button onclick="randomize()">随机生命体</button><h2>基因操作</h2><button onclick="mutate()">关系变异</button><button onclick="rewire()">依赖变异</button><button onclick="evolve()">连续演化 20 次</button><p><small>点击中央节点可反转其依赖关系。每次操作都重新验证全部约束。</small></p><h2>形式规则</h2><pre id="rules"></pre></section><section><h2>02 / 活体逻辑观测</h2><svg id="graph" viewBox="0 0 640 420"></svg><h2 id="status"></h2><pre id="proof"></pre></section><section><h2>03 / 模型挑战</h2><p>判断当前系统是否存在合法赋值。</p><button onclick="guess(true)">SAT 可满足</button><button onclick="guess(false)">UNSAT 不可满足</button><button onclick="copyPrompt()">复制测试题</button><p id="feedback"></p><h2>04 / 多轮协议</h2><button onclick="protocol()">生成挑战</button><button onclick="nextRound()">下一轮</button><pre id="challenge"></pre><textarea id="answer" placeholder='输入 JSON：{"status":"SAT","assignment":{"A":0}}' style="width:100%;min-height:100px;background:#090b15;color:white"></textarea><button onclick="grade()">验证回答</button><p id="verdict"></p><button onclick="targeted()">定向变异</button><h2>演化档案</h2><button onclick="save()">导出 JSON</button><div id="history"></div></section></main><script>
let rules=[],history=[],generation=0,last;const $=id=>document.getElementById(id);for(let i=2;i<=12;i++)$('n').add(new Option(i,i));$('n').value=5;const name=i=>String.fromCharCode(65+i);function solve(r,subset=r.map((_,i)=>i)){let count=0,witness=null;for(let m=0;m<2**r.length;m++){if(subset.every(i=>((m>>i)&1)===(((m>>r[i].to)&1)^r[i].neg))){count++;if(witness===null)witness=m}}return {count,witness}}
function core(r){let c=r.map((_,i)=>i);for(let i of [...c]){let t=c.filter(j=>j!==i);if(!solve(r,t).count)c=t}return c}function lines(){return rules.map((r,i)=>`${name(i)} = ${r.neg?'¬':''}${name(r.to)}`)}function record(action){last=solve(rules);let c=last.count?[]:core(rules);history.unshift({generation:++generation,action,rules:structuredClone(rules),count:last.count,core:c});render(c)}function seed(odd){let n=+ $('n').value;rules=Array.from({length:n},(_,i)=>({to:(i+1)%n,neg:1}));if(Boolean(n%2)!==odd)rules[0].neg=0;record(odd?'奇数否定':'偶数否定')}function randomize(){let n=+$('n').value;rules=Array.from({length:n},()=>({to:Math.floor(Math.random()*n),neg:Math.random()<.5?1:0}));record('随机生成')}function mutate(i=Math.floor(Math.random()*rules.length)){rules[i].neg^=1;record('反转 '+name(i))}function rewire(){let i=Math.floor(Math.random()*rules.length);rules[i].to=(rules[i].to+1+Math.floor(Math.random()*(rules.length-1)))%rules.length;record('重连 '+name(i))}function evolve(){for(let i=0;i<20;i++)Math.random()<.5?mutate():rewire()}
function render(c){$('rules').textContent=lines().join('\n');$('status').textContent=last.count?'SAT · '+last.count+' 组合法解':'UNSAT · 约束不可满足';$('status').className=last.count?'good':'bad';$('proof').textContent=last.count?'合法解示例：'+rules.map((_,i)=>name(i)+'='+((last.witness>>i)&1)).join('  '):'最小不可满足核心（按包含关系）：\n'+c.map(i=>lines()[i]).join('\n');$('feedback').textContent='';let p=rules.map((_,i)=>[320+155*Math.cos(2*Math.PI*i/rules.length-Math.PI/2),210+155*Math.sin(2*Math.PI*i/rules.length-Math.PI/2)]);let s='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#aaa0e8"/></marker></defs>';rules.forEach((r,i)=>{let [x,y]=p[i],[a,b]=p[r.to],d=Math.hypot(a-x,b-y),col=c.includes(i)?'#ff648d':'#7970c7';if(!d){s+=`<path d="M${x-12} ${y-16} c-50 -65 70 -65 24 0" fill="none" stroke="${col}" marker-end="url(#arrow)"/>`;return}let u=(a-x)/d,v=(b-y)/d;s+=`<path d="M${x+u*22} ${y+v*22} Q${(x+a)/2-v*22} ${(y+b)/2+u*22} ${a-u*25} ${b-v*25}" fill="none" stroke="${col}" stroke-width="2" marker-end="url(#arrow)"/><text x="${(x+a)/2-v*15}" y="${(y+b)/2+u*15}" fill="#e3dfff">${r.neg?'¬':'='}</text>`});p.forEach(([x,y],i)=>{let col=c.includes(i)?'#ff648d':'#a79aff';s+=`<g onclick="mutate(${i})" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="23" fill="#252344" stroke="${col}" stroke-width="3"/><text x="${x}" y="${y+6}" text-anchor="middle" fill="white">${name(i)}</text></g>`});$('graph').innerHTML=s;$('history').innerHTML=history.slice(0,100).map(h=>`<p>G${h.generation} · ${h.action} · <span class="${h.count?'good':'bad'}">${h.count?'SAT':'UNSAT'}</span></p>`).join('')}
function guess(v){$('feedback').textContent=v===Boolean(last.count)?'判断正确。':'判断错误，请检查形式规则。'}async function copyPrompt(){let t='在经典二值逻辑中，判断下列约束是否可满足。若可满足给出合法赋值，否则指出矛盾核心。\n'+lines().join('\n');try{await navigator.clipboard.writeText(t);$('feedback').textContent='已复制'}catch{window.prompt('复制测试题',t)}}function save(){let u=URL.createObjectURL(new Blob([JSON.stringify({history,experiments},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='paradox-history.json';a.click();URL.revokeObjectURL(u)}
let rounds=[],turn=0,experiments=[],failure=null;
function makeProtocol(base){
 let a=structuredClone(base), b=structuredClone(a), c=structuredClone(b);
 b[0].neg^=1;c=structuredClone(b);c[0].to=(c[0].to+1)%c.length;
 return [a,b,c].map((r,i)=>({rules:r,label:['初始世界','替换规则 A','改变 A 的依赖'][i]}));
}
function promptFor(r,i){return `第 ${i+1} 轮：${r.label}\n仅依据本轮完整规则，使用经典二值逻辑。\n`+r.rules.map((x,j)=>`${name(j)} = ${x.neg?'¬':''}${name(x.to)}`).join('\n')+'\n返回 JSON：SAT 时提供完整 assignment（每个变量为 0 或 1）；UNSAT 时提供 core（矛盾规则的左侧变量名数组）。'}
function showRound(){ $('challenge').textContent=promptFor(rounds[turn],turn);$('answer').value='';$('verdict').textContent='';}
function protocol(){rounds=makeProtocol(rules);turn=0;showRound()}
function nextRound(){if(!rounds.length)return protocol();if(turn+1<rounds.length){turn++;showRound()}else $('verdict').textContent='协议结束；可导出实验记录。'}
function assess(r,a){
 if(!a||!['SAT','UNSAT'].includes(a.status))return 'FORMAT';
 let truth=solve(r).count>0;
 if((a.status==='SAT')!==truth)return truth?'FALSE_PARADOX':'MISSED_CONFLICT';
 if(truth){let v=a.assignment;if(!v||!r.every((_,i)=>[0,1].includes(v[name(i)])))return 'INVALID_WITNESS';
 return r.every((x,i)=>v[name(i)]===(v[name(x.to)]^x.neg))?'PASS':'INVALID_WITNESS';}
 if(!Array.isArray(a.core)||!a.core.length||a.core.some(x=>typeof x!=='string'||x.length!==1||x.charCodeAt(0)-65<0||x.charCodeAt(0)-65>=r.length))return 'INVALID_CORE';
 let ids=[...new Set(a.core.map(x=>x.charCodeAt(0)-65))];return solve(r,ids).count?'INVALID_CORE':'PASS';
}
function grade(){if(!rounds.length)return;let raw=$('answer').value, result;try{result=assess(rounds[turn].rules,JSON.parse(raw))}catch{result='FORMAT'};experiments.push({round:turn+1,rules:structuredClone(rounds[turn].rules),response:raw,result});failure=['PASS','FORMAT'].includes(result)?null:result;$('verdict').textContent=result;$('verdict').className=result==='PASS'?'good':'bad'}
function targeted(){if(!failure){$('verdict').textContent='先提交一个存在逻辑错误的模型回答。';return}let source=experiments.at(-1).rules;let want=failure==='FALSE_PARADOX'||failure==='INVALID_WITNESS';for(let k=0;k<200;k++){let r=structuredClone(source),i=Math.floor(Math.random()*r.length);r[i].neg^=1;if(k%2)r[i].to=Math.floor(Math.random()*r.length);if((solve(r).count>0)===want&&JSON.stringify(r)!==JSON.stringify(source)){rules=r;record('定向变异 '+failure);failure=null;protocol();return}}$('verdict').textContent='预算内未找到符合条件的变体。'}

seed(true);
</script></html>
